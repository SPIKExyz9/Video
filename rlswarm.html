<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gensyn RL-Swarm Animation</title>
<style>
  body {
    margin: 0;
    background: #ffffff;
    overflow: hidden;
    font-family: "Poppins", sans-serif;
  }

  h1 {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    color: #111;
    font-size: 24px;
    z-index: 10;
  }

  #canvas {
    position: absolute;
    top: 0;
    left: 0;
  }

  .legend {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.8);
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 14px;
    color: #333;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>
  <h1>⚙️ Gensyn RL-Swarm – Peer-to-Peer Network</h1>
  <canvas id="canvas"></canvas>
  <div class="legend">
    🧠 Nodes collaborate → share data → aggregate → Testnet verifies & rewards
  </div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

class Node {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = (Math.random() - 0.5) * 0.6;
    this.radius = 6;
    this.color = "#007bff";
  }

  move() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0 || this.x > w) this.vx *= -1;
    if (this.y < 0 || this.y > h) this.vy *= -1;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
  }
}

const nodes = [];
const NODE_COUNT = 30;
for (let i = 0; i < NODE_COUNT; i++) {
  nodes.push(new Node(Math.random() * w, Math.random() * h));
}

function connectNodes() {
  for (let i = 0; i < NODE_COUNT; i++) {
    for (let j = i + 1; j < NODE_COUNT; j++) {
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 180) {
        ctx.strokeStyle = `rgba(0,123,255,${1 - dist / 180})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
      }
    }
  }
}

function drawCore() {
  // central "Gensyn Testnet" node
  const cx = w / 2, cy = h / 2;
  ctx.beginPath();
  ctx.arc(cx, cy, 35, 0, Math.PI * 2);
  ctx.fillStyle = "#00c853";
  ctx.fill();
  ctx.font = "14px Poppins";
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.fillText("Gensyn", cx, cy + 4);
  // faint link lines
  for (let n of nodes) {
    ctx.strokeStyle = "rgba(0,200,83,0.15)";
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(n.x, n.y);
    ctx.stroke();
  }
}

function animate() {
  ctx.clearRect(0, 0, w, h);
  connectNodes();
  drawCore();
  nodes.forEach(n => {
    n.move();
    n.draw();
  });
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
